<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Annastepnuk Housing | Personal Large Home</title>
  <meta name="description" content="Personal large home gallery for Annastepnuk Housing.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cinzel+Decorative:wght@400;700&family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="index.html">
        <span class="brand-mark">Annastepnuk Housing</span>
        <span class="brand-sub">FFXIV Interior Design</span>
      </a>
      <nav class="nav-tabs" aria-label="Main">
        <a class="nav-tab" href="index.html">Home</a>
        <a class="nav-tab active" href="gallery.html">Gallery</a>
        <a class="nav-tab" href="services.html">Services</a>
        <a class="nav-tab" href="process.html">Process</a>
        <a class="nav-tab" href="auction.html">Auction</a>
        <a class="nav-tab" href="contact.html">Contact</a>
      </nav>
    </div>
  </header>

  <main class="page site-shell" id="personal-large-build-root"></main>

  <footer class="footer site-shell">
    <div class="footer-card">
      <p class="footer-copy">Need the payment structure and design process behind these builds?</p>
      <a class="button-soft" href="process.html">Open Process</a>
    </div>
  </footer>
  <div class="lightbox" data-lightbox hidden>
    <div class="lightbox-backdrop" data-lightbox-close></div>
    <div class="lightbox-dialog" role="dialog" aria-modal="true" aria-label="Expanded gallery image">
      <button class="lightbox-close" type="button" aria-label="Close image" data-lightbox-close>&times;</button>
      <img class="lightbox-image" src="" alt="">
    </div>
  </div>
  <script src="personal-large-builds.js"></script>
  <script>
    const root = document.getElementById('personal-large-build-root');
    const params = new URLSearchParams(window.location.search);
    const slug = params.get('build');
    const builds = Array.isArray(PERSONAL_LARGE_BUILDS) ? PERSONAL_LARGE_BUILDS : [];
    const buildIndex = builds.findIndex((item) => item.slug === slug);
    const build = buildIndex >= 0 ? builds[buildIndex] : builds[0];

    if (!build) {
      root.innerHTML = '<section class="gallery-section gallery-page"><section class="panel section"><p class="section-kicker">Gallery</p><h1 class="section-heading">No build found.</h1><div class="hero-actions"><a class="button" href="personal-large-homes.html">Back to Personal Large Homes</a></div></section></section>';
    } else {
      document.title = 'Annastepnuk Housing | ' + build.title;
      const prevBuild = builds[buildIndex - 1];
      const nextBuild = builds[buildIndex + 1];
      const thumbs = build.images.map((src, index) => {
        const active = index === 0 ? ' active' : '';
        const alt = build.title + ' large personal home image ' + (index + 1) + '.';
        return '<button class="stack-thumb' + active + '" type="button" data-stack-thumb data-image-src="' + src + '" data-image-alt="' + alt + '"><img class="gallery-image" src="' + src + '" alt=""></button>';
      }).join('');
      const prevLink = prevBuild
        ? '<a class="gallery-pager-link" href="personal-large-build.html?build=' + prevBuild.slug + '"><span class="gallery-pager-label">Previous Build</span><strong>' + prevBuild.title + '</strong></a>'
        : '<a class="gallery-pager-link" href="personal-large-homes.html"><span class="gallery-pager-label">Back</span><strong>Personal - Large Homes</strong></a>';
      const nextLink = nextBuild
        ? '<a class="gallery-pager-link gallery-pager-link-next" href="personal-large-build.html?build=' + nextBuild.slug + '"><span class="gallery-pager-label">Next Build</span><strong>' + nextBuild.title + '</strong></a>'
        : '<a class="gallery-pager-link gallery-pager-link-next" href="personal-large-homes.html"><span class="gallery-pager-label">Back</span><strong>Personal - Large Homes</strong></a>';

      root.innerHTML =
        '<section class="gallery-section gallery-page">' +
          '<div class="gallery-hero">' +
            '<div class="gallery-intro">' +
              '<p class="section-kicker">Personal Gallery</p>' +
              '<h1 class="gallery-landing-title">' + build.title + '</h1>' +
              '<p class="lead">A personal large home gallery presented in the same screenshot order as the uploaded build set.</p>' +
            '</div>' +
            '<div class="gallery-price-panel">' +
              '<p class="gallery-price-kicker">Large personal home</p>' +
              '<div class="gallery-price-list">' +
                '<p><strong>Starting price</strong><span>50m gil</span></p>' +
                '<p><strong>Category</strong><span>Personal - Large Homes</span></p>' +
                '<p><strong>Build</strong><span>' + build.title + '</span></p>' +
              '</div>' +
              '<p class="gallery-price-note">Final totals may vary based on complexity, item count, and custom requests. Furniture costs are separate unless otherwise arranged.</p>' +
            '</div>' +
          '</div>' +
          '<section class="venue-gallery-showcase">' +
            '<article class="stack-showcase panel" data-stack-showcase>' +
              '<div class="stack-copy">' +
                '<p class="gallery-label">Featured Build</p>' +
                '<h2 class="gallery-title">' + build.title + '</h2>' +
                '<p class="body-copy">Browse the full ' + build.title + ' gallery below. Use the thumbnails or arrows to move through each uploaded room and detail shot in order.</p>' +
                '<div class="stack-details">' +
                  '<p><strong>Starting price</strong><span>50 million gil</span></p>' +
                  '<p><strong>Category</strong><span>Large Personal Home</span></p>' +
                  '<p><strong>Style note</strong><span>' + build.style + '</span></p>' +
                '</div>' +
                '<p class="stack-note">Thank you for touring the design. Open the full image view at any point for a closer look.</p>' +
                '<p class="stack-counter"><span data-stack-current>1</span> / <span data-stack-total>' + build.images.length + '</span></p>' +
              '</div>' +
              '<div class="stack-stage">' +
                '<button class="stack-nav stack-nav-prev" type="button" data-stack-prev aria-label="Previous image">&larr;</button>' +
                '<div class="stack-frame">' +
                  '<div class="stack-layer stack-layer-back"></div>' +
                  '<div class="stack-layer stack-layer-mid"></div>' +
                  '<button class="gallery-tile stack-main" type="button" data-gallery-image data-stack-open>' +
                    '<img class="gallery-image stack-main-image" src="' + build.images[0] + '" alt="' + build.title + ' large personal home featured interior view.">' +
                    '<span class="gallery-tile-caption">Open full view</span>' +
                  '</button>' +
                '</div>' +
                '<button class="stack-nav stack-nav-next" type="button" data-stack-next aria-label="Next image">&rarr;</button>' +
              '</div>' +
              '<div class="stack-thumbs" data-stack-thumbs>' + thumbs + '</div>' +
            '</article>' +
          '</section>' +
          '<nav class="gallery-pager panel" aria-label="Personal large home galleries">' +
            prevLink +
            nextLink +
          '</nav>' +
        '</section>';
    }
  </script>
  <script src="gallery-showcase.js"></script>
</body>
</html>
